<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0 0.07  0 0 0 0.55 -0.12"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<!-- one carved petal arch, pointing inwards (down) along the top edge; drawn in a 40-wide cell -->
<g id="p"><path d="M4 9 H36 V12 C36 24 28 31 20 31 C12 31 4 24 4 12Z" fill="#8f6a3c"/><path d="M8 12 H32 C32 21 26 27 20 27 C14 27 8 21 8 12Z" fill="#cfa974"/><path d="M8 12 C8 21 14 27 20 27" fill="none" stroke="#f0d6a3" stroke-width="1.2"/><path d="M32 12 C32 21 26 27 20 27" fill="none" stroke="#5c3f1f" stroke-width="1.4"/><circle cx="20" cy="17" r="2.6" fill="#6d4c27"/></g>
<g id="r"><rect x="-13" y="-13" width="26" height="26" fill="#8f6a3c"/><rect x="-11" y="-11" width="22" height="22" fill="#cfa974"/><path d="M0 -9 C3 -3 3 -3 9 0 C3 3 3 3 0 9 C-3 3 -3 3 -9 0 C-3 -3 -3 -3 0 -9Z" fill="#7a5630"/><path d="M0 -9 C3 -3 3 -3 9 0" fill="none" stroke="#f0d6a3" stroke-width="1"/><circle r="2.4" fill="#e6c891"/></g>
</defs>
<path fill-rule="evenodd" d="M0 0H120V120H0Z M40 40V80H80V40Z" fill="#b8915c"/>
<path fill-rule="evenodd" d="M0 0H120V120H0Z M40 40V80H80V40Z" fill="#000" filter="url(#g)"/>
<!-- outer chamfer: light from top-left -->
<path d="M0 0H120L116 4H4V116L0 120Z" fill="#e8cc96" opacity="0.8"/>
<path d="M120 0V120H0L4 116H116V4Z" fill="#4a3219" opacity="0.85"/>
<!-- petals on all four edges (the middle cell repeats along each side) -->
<use xlink:href="#p" x="40" y="0"/>
<use xlink:href="#p" transform="translate(120 40) rotate(90)"/>
<use xlink:href="#p" transform="translate(80 120) rotate(180)"/>
<use xlink:href="#p" transform="translate(0 80) rotate(-90)"/>
<!-- inner step-down moulding -->
<path d="M36 36H84V84H36Z" fill="none" stroke="#5c3f1f" stroke-width="2"/>
<path d="M38.5 38.5H81.5" stroke="#f0d6a3" stroke-width="1" opacity="0.8"/>
<path d="M38.5 38.5V81.5" stroke="#f0d6a3" stroke-width="1" opacity="0.8"/>
<!-- corner rosette blocks -->
<use xlink:href="#r" x="20" y="20"/><use xlink:href="#r" x="100" y="20"/><use xlink:href="#r" x="20" y="100"/><use xlink:href="#r" x="100" y="100"/>
</svg>
