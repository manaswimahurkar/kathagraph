name: Keep the API awake

# The free Render plan puts the API to sleep after 15 idle minutes, and the first visitor then
# waits 30-60 s for it to wake. A light /health call every 10 minutes keeps it ready.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://kathagraph-api.onrender.com/health
